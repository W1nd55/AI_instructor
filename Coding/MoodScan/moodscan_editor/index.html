<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body { color: #25322d; font: 400 19px/1.85 'DM Sans', sans-serif; }
    #editor {
      min-height: 510px;
      padding: 17px 13px;
      outline: none;
      border: 0;
      color: #25322d;
      caret-color: #426b59;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: normal;
      font: inherit;
    }
    #editor:empty::before {
      content: attr(data-placeholder);
      color: #a5ada7;
      pointer-events: none;
    }
    .mood-highlight {
      border-radius: 4px;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      padding: 1px 2px;
    }
    ::selection { background: #d9e5dc; }
  </style>
</head>
<body>
  <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="true"></div>
  <script>
    const editor = document.getElementById('editor');
    let previousText = '';
    let commitAfterInput = false;

    function post(type, payload = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, '*');
    }

    function textValue() {
      let value = editor.innerText || '';
      if (value === '\n' && editor.childElementCount === 0) value = '';
      return value.replace(/\u00a0/g, ' ');
    }

    function selectionOffset() {
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount || !editor.contains(selection.anchorNode)) return null;
      const range = selection.getRangeAt(0).cloneRange();
      range.selectNodeContents(editor);
      range.setEnd(selection.anchorNode, selection.anchorOffset);
      return range.toString().length;
    }

    function restoreSelection(offset) {
      if (offset === null) return;
      const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
      let node;
      let remaining = offset;
      while ((node = walker.nextNode())) {
        if (remaining <= node.length) {
          const range = document.createRange();
          range.setStart(node, remaining);
          range.collapse(true);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          return;
        }
        remaining -= node.length;
      }
      const range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function renderText(text, segments) {
      const caret = selectionOffset();
      editor.replaceChildren();
      let cursor = 0;
      for (const segment of (segments || [])) {
        const start = Math.max(cursor, Math.min(text.length, segment.start));
        const end = Math.max(start, Math.min(text.length, segment.end));
        if (start > cursor) editor.append(document.createTextNode(text.slice(cursor, start)));
        if (end > start) {
          const mark = document.createElement('span');
          mark.className = 'mood-highlight';
          mark.style.backgroundColor = segment.color || '#E7EAE7';
          mark.title = segment.emotion || 'mood';
          mark.textContent = text.slice(start, end);
          editor.append(mark);
        }
        cursor = end;
      }
      if (cursor < text.length) editor.append(document.createTextNode(text.slice(cursor)));
      editor.dataset.placeholder = 'Start typing your journal entry…';
      previousText = text;
      restoreSelection(caret);
    }

    function sendText() {
      post('streamlit:setComponentValue', {
        value: { text: textValue() },
        dataType: 'json'
      });
    }

    editor.addEventListener('input', () => {
      if (commitAfterInput) {
        commitAfterInput = false;
        // Wait until the browser inserts the line break before reading text.
        setTimeout(sendText, 100);
      }
    });
    editor.addEventListener('paste', event => {
      event.preventDefault();
      const text = (event.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
    });
    editor.addEventListener('keydown', event => {
      if (event.key === 'Enter') commitAfterInput = true;
      if (event.key === 'Tab') {
        event.preventDefault();
        document.execCommand('insertText', false, '  ');
      }
    });

    window.addEventListener('message', event => {
      const message = event.data;
      if (!message || message.type !== 'streamlit:render') return;
      const args = message.args || {};
      const text = typeof args.text === 'string' ? args.text : '';
      editor.dataset.placeholder = args.placeholder || 'Start typing your journal entry…';
      const currentText = textValue();
      // Keep any unfinished next line the user has already started while the
      // completed line is being analyzed by Python/Streamlit.
      const textToKeep = currentText.startsWith(text) ? currentText : text;
      if (textToKeep !== previousText || args.segments) renderText(textToKeep, args.segments || []);
      post('streamlit:setFrameHeight', { height: 545 });
    });

    post('streamlit:componentReady', { apiVersion: 1 });
    post('streamlit:setFrameHeight', { height: 545 });
  </script>
</body>
</html>
